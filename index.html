<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Solar System Lab은 태양-지구-달 궤도, 계절, 달 위상, 일식/월식을 3D로 탐구하는 과학 수업 도구입니다."
    />
    <meta name="theme-color" content="#070b16" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Solar System Lab — 3D 태양계 실험실</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #070b16; color: #e9effc; }
      .boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 10px; background: radial-gradient(circle at 50% 42%, #0c1730 0%, #05080f 62%, #02040a 100%); font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .boot-title { margin: 0; font-size: 24px; font-weight: 800; }
      .boot-sub { margin: 0; color: #8c9bb9; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" class="boot" role="status" aria-live="polite">
      <p class="boot-title">Solar System Lab</p>
      <p class="boot-sub">3D 태양계 실험실을 준비하고 있습니다</p>
    </div>
    <noscript>
      <div style="position: fixed; inset: 0; display: grid; place-content: center; padding: 24px">
        Solar System Lab을 사용하려면 브라우저에서 JavaScript를 허용해야 합니다.
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
